data:
  prompt_key: prompt
  answer_key: answer
  image_key: images
  format_prompt: null
  max_prompt_length: 2048
  max_response_length: 256
  min_pixels: 262144
  max_pixels: 1003520
  rollout_batch_size: 63
  mini_rollout_batch_size: 22
  val_batch_size: 64
  shuffle: true
  seed: 42

algorithm:
  adv_estimator: grpo
  norm_adv_by_std: false
  ithv_dual:
    enabled: true
    risk_budget: 0.14
    lambda_init: null
    learning_rate: 0.1
    lambda_max: 1.0
    ema_beta: 0.8
    monitor_prompts: 66
    advantage_scale: 2.0
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0.0
  online_filtering: true
  filter_key: accuracy
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 21
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    ppo_epochs: 1
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_dual: 10.0
    model:
      enable_gradient_checkpointing: true
      lora:
        rank: 64
        alpha: 64
        target_modules: all-linear
        exclude_modules: '.*visual.*'
    optim:
      lr: 1.0e-5
      lr_warmup_ratio: 0.03
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    seed: 42
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.45
    val_override_config:
      n: 2
      temperature: 0.8
      top_p: 1.0

trainer:
  total_epochs: 2
  max_steps: null
  project_name: ithv
  logger: [console, file]
  nnodes: 1
  max_try_make_batch: 100
  val_before_train: true
  val_freq: -1
  val_generations_to_log: 8
  save_freq: 5
  save_limit: -1
  save_model_only: false
  save_adapter_only: true
  find_last_checkpoint: false
